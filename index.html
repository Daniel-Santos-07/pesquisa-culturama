<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Favicon -->
    <link rel="icon" href="./img/culturama-favico.png">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Fontes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans:wght@100..900&display=swap" rel="stylesheet">

    <title>Pesquisa Culturama</title>
</head>
<body>

<header>
    <img src="./img/logo-culturama.png" alt="Logo da Culturama">
    <h1>Pesquisa Online</h1>
</header>

<main>
<section>
<form action="" method="get">

    <!-- Dados Pessoais -->
    <fieldset>
        <legend>Dados Pessoais</legend>

        <label for="name">Nome</label>
        <input id="name" type="text" name="userName" required>

        <label for="age">Idade</label>
        <input id="age" type="number" name="userAge" min="12" max="100" required>

        <label for="birthDate">Data de Nascimento</label>
        <input id="birthDate" type="date" name="birthDate">

        <label for="email">Email</label>
        <input id="email" type="email" name="userEmail" required>

        <label for="phone">Telefone</label>
        <input id="phone" type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="DDD + número sem espaços">

        <label for="userImage">Upload de foto</label>
        <input id="userImage" type="file" name="userImage" accept="image/*">
    </fieldset>

    <!-- Perfil -->
    <fieldset>
        <legend>Perfil</legend>

        <p>Gênero:</p>
        <input id="masculino" type="radio" name="userGender" value="Masculino">
        <label for="masculino">Masculino</label>

        <input id="feminino" type="radio" name="userGender" value="Feminino">
        <label for="feminino">Feminino</label>

        <input id="outro" type="radio" name="userGender" value="Outro">
        <label for="outro">Outro</label>

        <label for="maritalStatus">Estado Civil</label>
        <select id="maritalStatus" name="maritalStatus">
            <option value="">Selecione</option>
            <option value="Solteiro">Solteiro(a)</option>
            <option value="Casado">Casado(a)</option>
            <option value="Divorciado">Divorciado(a)</option>
            <option value="Viúvo">Viúvo(a)</option>
            <option value="UniaoEstavel">União Estável</option>
        </select>

        <label for="state">Estado</label>
        <select id="state" name="userState" required>
            <option value="">Selecione</option>
            <option value="SP">São Paulo</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="MG">Minas Gerais</option>
            <option value="RS">Rio Grande do Sul</option>
            <!-- pode completar depois -->
        </select>
    </fieldset>

    <!-- Hábitos -->
    <fieldset>
        <legend>Hábitos</legend>

        <p>Redes Sociais:</p>
        <input type="checkbox" id="instagram" name="social[]" value="instagram">
        <label for="instagram">Instagram</label>

        <input type="checkbox" id="facebook" name="social[]" value="facebook">
        <label for="facebook">Facebook</label>

        <input type="checkbox" id="x" name="social[]" value="x">
        <label for="x">X</label>

        <input type="checkbox" id="linkedin" name="social[]" value="linkedin">
        <label for="linkedin">LinkedIn</label>

        <label for="musicStyle">Estilo Musical</label>
        <input list="styleTypes" id="musicStyle" name="userMusicStyle">

        <datalist id="styleTypes">
            <option value="Rock">
            <option value="Pop">
            <option value="Sertanejo">
            <option value="Funk">
            <option value="MPB">
        </datalist>
    </fieldset>

    <!-- Opinião -->
    <fieldset>
        <legend>Opinião</legend>

        <p>Qualidade do serviço:</p>

        <input type="radio" id="otimo" name="userServiceOpinion" value="otimo">
        <label for="otimo">Ótimo</label>

        <input type="radio" id="bom" name="userServiceOpinion" value="bom">
        <label for="bom">Bom</label>

        <input type="radio" id="regular" name="userServiceOpinion" value="regular">
        <label for="regular">Regular</label>

        <input type="radio" id="ruim" name="userServiceOpinion" value="ruim">
        <label for="ruim">Ruim</label>

        <label for="comment">Comentário</label>
        <textarea id="comment" name="userComment" rows="4" placeholder="Digite sua opinião..."></textarea>
    </fieldset>

    <!-- Confirmações -->
    <fieldset>
        <legend>Confirmações</legend>

        <input type="checkbox" id="lgpd" name="userLgpd" required>
        <label for="lgpd">Aceito participar da pesquisa</label>

        <input type="checkbox" id="results" name="userGetResult">
        <label for="results">Quero receber resultados por email</label>
    </fieldset>

    <!-- Botões -->
    <div>
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
    </div>

</form>
</section>
</main>

</body>
</html>
